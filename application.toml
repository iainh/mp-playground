[server]
host = "127.0.0.1"
port = 3000

[server.http]
request-timeout-seconds = 30

[service]
name = "mp-playground"
greeting = "Hello from ${service.name}"
display-name = "MicroProfile playground"

[client]
requestTimeoutMs = 250

[datasource]
db-kind = "sqlite"
url = "sqlite::memory:"

[datasource.pool]
min-size = 1
max-size = 1
acquire-timeout = "1s"

[datasource.audit]
db-kind = "sqlite"
url = "sqlite::memory:"

[datasource.events]
db-kind = "sqlite"
url = "sqlite::memory:"

[logging]
filter = "info,mp_playground=debug"
format = "compact"
target = true
thread-ids = false
thread-names = false
file = false
line-number = false
ansi = true

[fault-tolerance]
timeout = "250ms"
max-retries = 2
retry-delay = "25ms"
bulkhead-size = 4
circuit-request-volume = 4
circuit-failure-ratio = 0.5
circuit-delay = "1500ms"
