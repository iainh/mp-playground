[package]
name = "mp-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "tokio"] }
axum-fault-tolerance = { path = "../axum-fault-tolerance", features = ["axum-health", "mp-config"] }
axum-health = { path = "../axum-health" }
mp-config = { path = "../mp-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
